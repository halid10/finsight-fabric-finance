name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  donnees:
    name: Lint + génération + tests de cohérence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff)
        run: pipx run ruff check data tests fabric --config ruff.toml
      - name: Le jeu de données commité est à jour (génération reproductible)
        run: |
          python data/generator/generate_finance_data.py
          git diff --exit-code --stat data/raw
      - name: Tests de cohérence des données
        run: python -m unittest discover -s tests -v

  notebooks:
    name: Exécution des notebooks Fabric (PySpark + Delta en local)
    runs-on: ubuntu-latest
    needs: donnees
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer PySpark + Delta
        run: pip install pyspark==3.5.3 delta-spark==3.2.1
      - name: Bronze → Silver → Gold → Qualité
        run: python tests/run_notebooks_local.py
